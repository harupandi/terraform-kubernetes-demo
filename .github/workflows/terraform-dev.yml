name: Terraform Azure Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'
  push:
    branches: [main]
    paths:
      - 'envs/dev/**'
      - 'modules/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VERSION: "1.16.0"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_location: ${{ vars.LOCATION}}
          TF_VAR_environment: ${{ vars.ENVIRONMENT}}
          TF_VAR_pod_cidr: ${{ vars.POD_CIDR}}
          TF_VAR_service_cidr: ${{ vars.SERVICE_CIDR}}
          TF_VAR_dns_service_ip: ${{ vars.DNS_SERVICE_IP}}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: envs/dev/plan.txt
          retention-days: 14

      # Comment the Plan output to the PR
      - name: Comment Terraform Plan
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let plan = fs.readFileSync('envs/dev/plan.txt', 'utf8');

            // GitHub caps comment bodies at 65536 chars — leave headroom for
            // the surrounding markdown/marker/footer text.
            const maxLength = 60000;
            let truncated = false;
            if (plan.length > maxLength) {
              plan = plan.slice(0, maxLength);
              truncated = true;
            }

            const marker = '<!-- terraform-dev-plan-comment -->';

            const body = `${marker}
            ## Terraform Plan - Dev

            <details>
            <summary>Show Terraform Plan</summary>

            \`\`\`
            ${plan}${truncated ? '\n\n... (truncated — see full plan in the workflow run artifact "terraform-plan-dev")' : ''}
            \`\`\`

            </details>

            *Generated by GitHub Actions for commit ${context.sha}.*`;

            const { data: comments } =
              await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

            const existingComment = comments.find(
              comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes(marker)
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                comment_id: existingComment.id,
                body: body
              });

              console.log(`Updated Terraform plan comment: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });

              console.log('Created Terraform plan comment');
            }

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve